name: GEM Accounts and Mining Participants

on:
  push:
    branches: [feature/global-mineral-intelligence]
    paths:
      - 'server/gem/gemAccountApi.js'
      - 'server/gem/gemAccountApi.test.mjs'
      - 'src/ui/gemWebExperience.js'
      - 'src/ui/gemPlanetSurface.js'
      - 'src/ui/gemPlanetSurface.js'
      - 'build/vite.js'
      - '.github/workflows/gem-account-tests.yml'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'server/gem/gemAccountApi.js'
      - 'server/gem/gemAccountApi.test.mjs'
      - 'src/ui/gemWebExperience.js'
      - 'src/ui/gemPlanetSurface.js'
      - 'build/vite.js'
      - '.github/workflows/gem-account-tests.yml'

permissions:
  contents: read

concurrency:
  group: gem-account-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  account-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test account and participant API
        run: node --test server/gem/gemAccountApi.test.mjs
      - name: Build application
        run: npm run build
