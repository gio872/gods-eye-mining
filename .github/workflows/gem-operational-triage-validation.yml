name: GEM operational triage validation

on:
  push:
    branches:
      - feature/global-mineral-intelligence

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Normalize GEM sources
        run: npx prettier --write src/mineral/earthriseMiningDetector.js src/mineral/globalMineralIntelligence.js src/mineral/miningOpportunity.js src/mineral/miningOpportunity.test.mjs

      - name: Run GEM tests
        run: |
          node --test src/mineral/globalMineralSearch.test.mjs             src/mineral/earthriseMiningDetector.test.mjs             src/mineral/miningOpportunity.test.mjs             src/mineral/trueProspectivity.test.mjs

      - name: Check integration syntax
        run: |
          node --check src/mineral/earthriseMiningDetector.js
          node --check src/mineral/globalMineralIntelligence.js
          node --check src/mineral/miningOpportunity.js
          node --check src/mineral/trueProspectivity.js

      - name: Build GEM
        run: npm run build

      - name: Commit formatting and remove validator
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mineral/earthriseMiningDetector.js src/mineral/globalMineralIntelligence.js src/mineral/miningOpportunity.js src/mineral/miningOpportunity.test.mjs
          git rm .github/workflows/gem-operational-triage-validation.yml
          git commit -m "GEM: normalize operational triage implementation"
          git push
