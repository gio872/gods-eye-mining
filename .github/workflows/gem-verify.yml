name: GEM Verify

on:
  push:
    branches: [gem-core]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caa864d2e1d84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - run: node --test src/mining/index.test.mjs src/mining/evidence.test.mjs src/mining/sources/sgcGeology.test.mjs
      - run: npm run check:boundaries
