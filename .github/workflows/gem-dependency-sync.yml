name: GEM dependency sync

on:
  push:
    branches:
      - feature/global-mineral-intelligence

permissions:
  contents: write

jobs:
  sync:
    if: !contains(github.event.head_commit.message, 'Remove temporary GEM dependency sync workflow')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/global-mineral-intelligence
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.x
          cache: npm

      - name: Refresh lockfile
        run: npm install geotiff@^2.1.4 --package-lock-only --ignore-scripts

      - name: Commit lockfile and remove helper
        shell: bash
        run: |
          git config user.name "GEM Automation"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync GeoTIFF dependency lockfile"
            git push origin feature/global-mineral-intelligence
            exit 0
          fi
          git rm .github/workflows/gem-dependency-sync.yml
          git commit -m "Remove temporary GEM dependency sync workflow"
          git push origin feature/global-mineral-intelligence
