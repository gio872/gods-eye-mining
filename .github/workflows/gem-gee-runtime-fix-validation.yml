name: GEM GEE runtime fix validation

on:
  push:
    branches:
      - feature/global-mineral-intelligence

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install
        run: npm ci
      - name: Runtime checks
        run: |
          node --check src/maps/geeImagery.js
          node --check scripts/pinokio-start.mjs
          node --check server/providers/earthengine.js
          python -m py_compile server/providers/earthengine_gateway.py
          node --test src/ui/mapSourceControls.test.mjs src/mineral/earthriseMiningDetector.test.mjs src/mineral/miningOpportunity.test.mjs
      - name: Build
        run: npm run build
      - name: Remove one-shot validator
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gem-gee-runtime-fix-validation.yml
          git commit -m "chore: remove one-shot GEE runtime validator"
          git push
