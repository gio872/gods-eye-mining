name: Format intelligence
on:
  push:
    branches: [gem-core]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea528ea5282d1d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - run: npm run format -- --write
      - run: tar -czf intelligence-formatted.tgz src/intelligence/layers.js src/intelligence/index.js src/app/constructCatalog.js package.json
      - uses: actions/upload-artifact@v4
        with:
          name: intelligence-formatted
          path: intelligence-formatted.tgz
