name: GEM format normalization
# One-shot formatter for the global mineral search implementation.

on:
  push:
    branches:
      - feature/global-mineral-intelligence

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Normalize GEM search sources
        run: npx prettier --write src/mineral/geochemistry.js src/mineral/globalMineralIntelligence.js src/mineral/globalMineralSearch.js

      - name: Commit formatted sources and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mineral/geochemistry.js src/mineral/globalMineralIntelligence.js src/mineral/globalMineralSearch.js
          git rm .github/workflows/gem-format-normalization.yml
          git commit -m "GEM: normalize global mineral search formatting"
          git push
