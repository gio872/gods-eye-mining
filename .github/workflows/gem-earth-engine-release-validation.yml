name: GEM Earth Engine release validation

on:
  push:
    branches:
      - feature/global-mineral-intelligence

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run GEM tests
        run: node --test src/ui/mapSourceControls.test.mjs src/mineral/globalMineralSearch.test.mjs src/mineral/earthriseMiningDetector.test.mjs src/mineral/miningOpportunity.test.mjs src/mineral/trueProspectivity.test.mjs
      - name: Check JavaScript syntax
        run: |
          node --check src/app/scene.js
          node --check src/maps/controller.js
          node --check src/maps/defaultSources.js
          node --check src/maps/geeImagery.js
          node --check src/ui/mapSourceControls.js
          node --check server/providers/earthengine.js
          node --check scripts/pinokio-start.mjs
      - name: Check Python gateway
        run: python -m py_compile server/providers/earthengine_gateway.py
      - name: Build
        run: npm run build
      - name: Remove one-shot validator
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gem-earth-engine-release-validation.yml
          git commit -m "chore: remove one-shot Earth Engine release validator"
          git push
