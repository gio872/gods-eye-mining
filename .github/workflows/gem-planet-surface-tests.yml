name: GEM Planetary Surface

on:
  push:
    branches: [feature/global-mineral-intelligence]
    paths:
      - 'src/ui/gemPlanetSurface.js'
      - 'src/ui/gemPlanetSurface.test.mjs'
      - 'src/ui/gemWebExperience.js'
      - 'src/main.js'
      - 'src/standalone/application.js'
      - 'src/ui/gemWorkspaceRoute.js'
      - 'src/ui/gemWorkspaceRoute.test.mjs'
      - 'src/ui/gemGlobalSurfaceWindow.js'
      - 'src/ui/gemGlobalSurfaceWindow.test.mjs'
      - 'src/app/controls.js'
      - 'src/app/tools.js'
      - 'src/standalone/controls.js'
      - '.github/workflows/gem-planet-surface-tests.yml'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'src/ui/gemPlanetSurface.js'
      - 'src/ui/gemPlanetSurface.test.mjs'
      - 'src/ui/gemWebExperience.js'
      - 'src/main.js'
      - 'src/standalone/application.js'
      - '.github/workflows/gem-planet-surface-tests.yml'
permissions:
  contents: read
concurrency:
  group: gem-planet-surface-${{ github.ref }}
  cancel-in-progress: true
jobs:
  surface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test planetary surface helpers
        run: node --test src/ui/gemPlanetSurface.test.mjs src/ui/gemWorkspaceRoute.test.mjs src/ui/gemGlobalSurfaceWindow.test.mjs
      - name: Build application
        run: npm run build
