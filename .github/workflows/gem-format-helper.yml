name: GEM formatter helper

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  format-gem:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - name: Check out PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@49933ea528ca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.x
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format GEM runtime modules
        run: |
          npx prettier --write \
            src/mineral/evidenceFusion.js \
            src/mineral/globalMineralIntelligence.js \
            src/mineral/globalMineralSources.js \
            src/mineral/globalTargetEngine.js \
            src/mineral/trueProspectivity.js

      - name: Commit formatting and remove helper
        shell: bash
        run: |
          git config user.name "GEM Formatter"
          git config user.email "actions@users.noreply.github.com"
          git add src/mineral/evidenceFusion.js src/mineral/globalMineralIntelligence.js src/mineral/globalMineralSources.js src/mineral/globalTargetEngine.js src/mineral/trueProspectivity.js
          git rm .github/workflows/gem-format-helper.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Format GEM true prospectivity modules"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"