name: GEM GEE runtime validation

on:
  push:
    branches:
      - feature/global-mineral-intelligence

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - name: Syntax and tests
        run: |
          node --check src/maps/geeImagery.js
          node --check src/maps/defaultSources.js
          node --check src/maps/controller.js
          node --check src/mapStackController.js
          node --check src/app/scene.js
          node --check src/ui/mapSourceControls.js
          node --check scripts/configure-earthengine.mjs
          node --check scripts/pinokio-start.mjs
          node --test src/ui/mapSourceControls.test.mjs src/maps/sourceFactories.test.mjs src/maps/controller.test.mjs src/mineral/trueProspectivity.test.mjs src/mineral/earthriseMiningDetector.test.mjs src/mineral/miningOpportunity.test.mjs
      - name: Python gateway compile
        run: python -m py_compile server/providers/earthengine_gateway.py
      - name: Build
        run: npm run build
      - name: Remove validator
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gem-gee-runtime-validation.yml
          git commit -m "chore: remove one-shot GEE runtime validator"
          git push
