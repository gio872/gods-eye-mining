name: GEM formatter

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.x
          cache: npm
      - run: npm ci --ignore-scripts
      - run: |
          npx prettier --write \
            src/mineral/evidenceFusion.js \
            src/mineral/globalMineralIntelligence.js \
            src/mineral/globalMineralSources.js \
            src/mineral/globalTargetEngine.js \
            src/mineral/trueProspectivity.js
      - name: Commit formatting
        run: |
          git config user.name "GEM Formatter"
          git config user.email "actions@users.noreply.github.com"
          git add src/mineral/evidenceFusion.js src/mineral/globalMineralIntelligence.js src/mineral/globalMineralSources.js src/mineral/globalTargetEngine.js src/mineral/trueProspectivity.js
          git commit -m 'Format GEM prospectivity modules' || true
          git fetch origin ${{ github.event.pull_request.head.ref }}
          git rebase origin/${{ github.event.pull_request.head.ref }} || true
          git push --force-with-lease origin "HEAD:${{ github.event.pull_request.head.ref }}"
          git rm .github/workflows/gem-formatter.yml || true
          git commit -m 'Remove temporary GEM formatter' || true
          git push --force-with-lease origin "HEAD:${{ github.event.pull_request.head.ref }}" || true