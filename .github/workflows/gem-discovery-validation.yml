name: GEM discovery validation

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.number == 2
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/global-mineral-intelligence
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Normalize GEM formatting
        run: npx prettier --write src/main.js src/data/dataCredits.js src/mineral/earthObservationEvidence.js src/mineral/geochemistry.js src/mineral/globalMineralIntelligence.js src/mineral/trueProspectivity.js src/mineral/trueProspectivity.test.mjs src/ui/mineralIntelligenceCenter.js src/ui/styles/global-mineral-intelligence.css DATA_SOURCES.md docs/GEM_GLOBAL_MINERAL_INTELLIGENCE_ARCHITECTURE.md package.json

      - name: Publish formatting
        shell: bash
        run: |
          git config user.name "GEM Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/main.js src/data/dataCredits.js src/mineral/earthObservationEvidence.js src/mineral/geochemistry.js src/mineral/globalMineralIntelligence.js src/mineral/trueProspectivity.js src/mineral/trueProspectivity.test.mjs src/ui/mineralIntelligenceCenter.js src/ui/styles/global-mineral-intelligence.css DATA_SOURCES.md docs/GEM_GLOBAL_MINERAL_INTELLIGENCE_ARCHITECTURE.md package.json
          if ! git diff --cached --quiet; then
            git commit -m "Normalize GEM discovery-engine formatting"
            git push origin feature/global-mineral-intelligence
            exit 0
          fi

      - name: Run GEM unit tests
        run: node --test src/mineral/trueProspectivity.test.mjs src/mineral/evidenceFusion.test.mjs src/mineral/globalTargetEngine.test.mjs src/mineral/globalMineralSources.test.mjs

      - name: Check controller syntax
        run: node --check src/mineral/globalMineralIntelligence.js

      - name: Remove temporary validator
        shell: bash
        run: |
          git config user.name "GEM Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/gem-discovery-validation.yml
          git commit -m "Remove temporary GEM discovery validator"
          git push origin feature/global-mineral-intelligence
